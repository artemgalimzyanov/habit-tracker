<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - 2026 Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --empty-square: #161b22;
            --square-border: rgba(255, 255, 255, 0.05);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .heatmap-wrapper {
            display: flex; gap: 8px; font-size: 10px; color: var(--text-muted);
        }

        .day-labels {
            display: grid; grid-template-rows: repeat(7, 10px); gap: 4px; padding-top: 20px;
        }

        .month-labels-container {
            position: relative; height: 15px; margin-bottom: 5px; width: 100%;
        }

        .month-label { position: absolute; white-space: nowrap; }

        .heatmap-grid {
            display: grid; grid-template-columns: repeat(53, 10px); grid-template-rows: repeat(7, 10px); grid-auto-flow: column; gap: 4px;
        }

        .day-square {
            width: 10px; height: 10px; border-radius: 2px; background-color: var(--empty-square); outline: 1px solid var(--square-border); outline-offset: -1px; cursor: pointer; transition: outline 0.1s ease;
        }

        .day-square:hover { outline: 1px solid #71767c; z-index: 10; }

        .day-square.out-of-range { visibility: hidden; pointer-events: none; }

        .custom-scrollbar::-webkit-scrollbar { height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0d1117; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }

        .hidden-auth { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-xl font-semibold text-white">Habit Tracker 2026</h1>
                <p id="auth-status" class="text-[10px] text-gray-500 mt-1">Initializing...</p>
            </div>
            
            <div id="user-controls" class="flex items-center gap-4">
                <button id="login-btn" onclick="signIn()" class="hidden-auth bg-white text-black px-4 py-1.5 rounded-md text-sm font-medium hover:bg-gray-200 transition">
                    Sign in with Google
                </button>

                <div id="logged-in-controls" class="hidden-auth flex items-center gap-4">
                    <button id="add-btn" onclick="openModal()" class="bg-[#238636] hover:bg-[#2ea043] text-white px-3 py-1.5 rounded-md text-sm font-medium transition">
                        New Habit
                    </button>
                    <div class="flex items-center gap-2 border-l border-gray-700 pl-4">
                        <img id="user-photo" src="" class="w-8 h-8 rounded-full border border-gray-600 hidden">
                        <button onclick="handleSignOut()" class="text-xs text-gray-500 hover:text-white">Sign Out</button>
                    </div>
                </div>
            </div>
        </header>

        <div id="error-banner" class="hidden mb-6 p-4 bg-red-900/20 border border-red-800 text-red-400 text-sm rounded-md">
            <strong>Configuration Error:</strong> <span id="error-message"></span>
        </div>

        <div id="main-content">
            <div id="logged-out-view" class="text-center py-20 bg-[#161b22] border border-[#30363d] rounded-xl">
                <h2 class="text-xl text-white mb-2">Track your progress in 2026</h2>
                <p class="text-gray-400 mb-6">Sign in to sync your habits across all your devices.</p>
                <button onclick="signIn()" class="bg-white text-black px-6 py-2 rounded-full font-semibold hover:bg-gray-200">Get Started</button>
            </div>

            <div id="habits-container" class="hidden-auth space-y-6"></div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#161b22] border border-[#30363d] rounded-lg w-full max-w-md p-6 shadow-2xl">
            <h2 class="text-lg font-semibold text-white mb-4">Add New Habit</h2>
            <div class="space-y-4">
                <input type="text" id="habit-name" placeholder="Habit Name" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-white focus:outline-none focus:border-[#238636]">
                <select id="habit-color" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-white">
                    <option value="#39d353">Green</option>
                    <option value="#38bdf8">Blue</option>
                    <option value="#f471ff">Purple</option>
                    <option value="#fb923c">Orange</option>
                </select>
            </div>
            <div class="flex justify-end space-x-3 mt-8">
                <button onclick="closeModal()" class="text-gray-400 hover:text-white">Cancel</button>
                <button onclick="addHabit()" class="bg-[#238636] px-4 py-2 rounded text-white font-medium hover:bg-[#2ea043]">Add Habit</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /**
         * ACTION REQUIRED: Replace the values below with your actual Firebase Project keys.
         * The error you received (auth/api-key-not-valid) means the strings below 
         * are currently placeholders and not your real Google API keys.
         */


        const firebaseConfig = {
            apiKey: "AIzaSyBcyXDEZnj0E_sPcUKpo-GS4gsCvhCvWIQ",
            authDomain: "habit-tracker-2026-cf029.firebaseapp.com",
            projectId: "habit-tracker-2026-cf029",
            storageBucket: "habit-tracker-2026-cf029.firebasestorage.app",
            messagingSenderId: "706204557684",
            appId: "1:706204557684:web:5947ed40d606b9abd64c21",
            measurementId: "G-1268DVE7Q8"
        };

        function showError(msg) {
            const banner = document.getElementById('error-banner');
            const text = document.getElementById('error-message');
            banner.classList.remove('hidden');
            text.innerText = msg;
        }

        let auth, db, currentUser = null, habits = [], unsubscribe = null;
        const appId = 'habit-tracker-2026';
        const provider = new GoogleAuthProvider();

        try {
            // Check if user has actually replaced the placeholder text
            if (firebaseConfig.apiKey.includes("PASTE_YOUR")) {
                throw new Error("You must replace the placeholder API keys in the code with your actual Firebase configuration found in Project Settings.");
            }

            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            onAuthStateChanged(auth, (user) => {
                updateUI(user);
                if (user) {
                    currentUser = user;
                    startSync(user.uid);
                } else {
                    currentUser = null;
                    if (unsubscribe) unsubscribe();
                }
            });

        } catch (err) {
            console.error("Initialization Error:", err);
            showError(err.message);
        }

        window.signIn = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                console.error("Login failed", err);
                showError(`Login failed: ${err.message}`);
            }
        };

        window.handleSignOut = () => {
            if(confirm("Are you sure you want to sign out?")) {
                signOut(auth);
            }
        };

        function updateUI(user) {
            const loginBtn = document.getElementById('login-btn');
            const loggedInControls = document.getElementById('logged-in-controls');
            const loggedOutView = document.getElementById('logged-out-view');
            const habitsContainer = document.getElementById('habits-container');
            const authStatus = document.getElementById('auth-status');

            if (user) {
                loginBtn.classList.add('hidden-auth');
                loggedInControls.classList.remove('hidden-auth');
                loggedOutView.classList.add('hidden-auth');
                habitsContainer.classList.remove('hidden-auth');
                authStatus.innerText = `Signed in as ${user.displayName || 'User'}`;
                if (user.photoURL) {
                    const img = document.getElementById('user-photo');
                    img.src = user.photoURL;
                    img.classList.remove('hidden');
                }
            } else {
                loginBtn.classList.remove('hidden-auth');
                loggedInControls.classList.add('hidden-auth');
                loggedOutView.classList.remove('hidden-auth');
                habitsContainer.classList.add('hidden-auth');
                authStatus.innerText = "Please sign in";
            }
        }

        const startSync = (userId) => {
            const habitsRef = collection(db, 'artifacts', appId, 'users', userId, 'habits');
            const q = query(habitsRef, orderBy("createdAt", "desc"));
            unsubscribe = onSnapshot(q, (snapshot) => {
                habits = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            }, (error) => {
                console.error("Sync error:", error);
                showError("Permission denied. Ensure your Firestore Rules are set correctly.");
            });
        };

        window.openModal = () => document.getElementById('modal').classList.remove('hidden');
        window.closeModal = () => {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('habit-name').value = '';
        };

        window.addHabit = async () => {
            const name = document.getElementById('habit-name').value;
            const color = document.getElementById('habit-color').value;
            if (!name || !currentUser) return;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'habits'), {
                    name, color, completedDays: [], createdAt: Date.now()
                });
                closeModal();
            } catch (e) { showError(e.message); }
        };

        window.toggleDay = async (habitId, dateStr) => {
            if (!currentUser) return;
            const habit = habits.find(h => h.id === habitId);
            const habitDoc = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'habits', habitId);
            let newDays = [...(habit.completedDays || [])];
            newDays = newDays.includes(dateStr) ? newDays.filter(d => d !== dateStr) : [...newDays, dateStr];
            await updateDoc(habitDoc, { completedDays: newDays });
        };

        window.deleteHabit = async (id) => {
            if (confirm('Delete this habit?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'habits', id));
            }
        };

        function get2026Grid() {
            const dates = [];
            const startDate = new Date(2025, 11, 29);
            for (let i = 0; i < 53 * 7; i++) {
                const d = new Date(startDate);
                d.setDate(startDate.getDate() + i);
                dates.push({
                    dateStr: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
                    isOutOfRange: d.getFullYear() !== 2026
                });
            }
            return dates;
        }

        function render() {
            const container = document.getElementById('habits-container');
            if (habits.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-500 border border-dashed border-gray-800 rounded-lg">No habits yet.</div>`;
                return;
            }
            container.innerHTML = '';
            const gridData = get2026Grid();
            habits.forEach(habit => {
                const card = document.createElement('div');
                card.className = "bg-[#161b22] border border-[#30363d] rounded-md p-4";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4"><h3 class="text-sm font-medium">${habit.name}</h3><button onclick="deleteHabit('${habit.id}')" class="text-xs text-gray-600 hover:text-red-400">Delete</button></div>
                    <div class="overflow-x-auto custom-scrollbar pb-2">
                        <div class="heatmap-wrapper" style="min-width: 750px;">
                            <div class="day-labels"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span></div>
                            <div class="heatmap-grid">
                                ${gridData.map(d => `<div class="day-square ${d.isOutOfRange ? 'out-of-range' : ''}" style="${(habit.completedDays||[]).includes(d.dateStr) ? `background-color: ${habit.color}; outline:none;` : ''}" onclick="toggleDay('${habit.id}', '${d.dateStr}')"></div>`).join('')}
                            </div>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
